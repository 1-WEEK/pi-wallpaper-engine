name: E2E

# Browser-level UI coverage (Playwright against the Vite dev server with all
# /api routes mocked). Kept out of ci.yml so a flaky browser run never blocks
# the correctness gates; treat this as an advisory signal, not a required
# status check (BL-18).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # See ci.yml: simple-git-hooks postinstall crashes under bun's virtual store.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "true"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
